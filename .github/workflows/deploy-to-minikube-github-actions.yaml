
name: Deploy to Minikube using GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Check Kubernetes cluster
        run: kubectl get nodes

      - name: Build Docker image
        run: |
          minikube image build -t devopshint/node-app:latest .

      - name: Deploy application
        run: |
          kubectl apply -f k8s/k8s-node-app.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/nodejs-app --timeout=120s
          kubectl get pods
          kubectl get services
          kubectl get endpoints nodejs-app

      - name: Test application
        run: |
          kubectl port-forward service/nodejs-app 8080:80 > /tmp/port-forward.log 2>&1 &

          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8080/health; then
              echo "Health check successful!"
              break
            fi
            sleep 2
          done

          curl --fail http://127.0.0.1:8080/

