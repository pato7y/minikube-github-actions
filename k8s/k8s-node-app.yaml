
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: default
  labels:
    app: nodejs-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
        - name: nodejs-app
          image: devopshint/node-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http

---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-app

spec:
  selector:
    app: nodejs-app

  type: NodePort

  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

